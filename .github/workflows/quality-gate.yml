name: Quality Gate

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline contract tests
        run: npm run test:offline

      - name: Verify project rules
        run: npm run verify:rules

      - name: Run Svelte check
        run: npm run check

      - name: Run Vitest
        run: npm test

      - name: Audit proposal copy
        run: npm run audit:copy

      - name: Build static site
        run: npm run build
