name: Build Isolated Preview Artifact

on:
  push:
    branches:
      - preview/proposal-messaging-copy-only-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build standalone preview
        run: env -u GITHUB_REPOSITORY npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: proposal-copy-preview-build
          path: build
          if-no-files-found: error
          retention-days: 1
