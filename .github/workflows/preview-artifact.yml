name: Preview Artifact

on:
  push:
    branches:
      - feat/ux-hierarchy-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify branch
        run: |
          npm run test:offline
          npm run verify:rules
          npm run check
          npm test
          npm run audit:copy

      - name: Build static preview
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ux-hierarchy-v2-preview
          path: build
          if-no-files-found: error
          retention-days: 7
